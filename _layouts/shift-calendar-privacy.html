<!doctype html>
<html lang="{{ page.lang | escape }}" dir="{{ page.direction | default: 'ltr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 20px 48px; color: #17233a; background: #fff; font: 18px/1.75 system-ui, sans-serif; }
    main, nav { max-width: 880px; margin-inline: auto; }
    main { overflow-wrap: anywhere; }
    nav { display: flex; flex-wrap: wrap; gap: 8px 16px; padding-block: 12px 24px; border-bottom: 1px solid #cbd5e1; direction: ltr; }
    nav a { padding: 4px 0; min-height: 44px; }
    nav a[aria-current="page"] { font-weight: 700; text-decoration-thickness: 3px; }
    a { color: #164da8; overflow-wrap: anywhere; }
    a:focus-visible { outline: 3px solid #164da8; outline-offset: 4px; }
    h1 { font-size: 1.75em; line-height: 1.4; }
    h2 { font-size: 1.35em; margin-block-start: 2em; }
    h3 { font-size: 1.1em; }
    li { margin-block: 6px; }
    code { direction: ltr; unicode-bidi: isolate; overflow-wrap: anywhere; }
    @media (max-width: 400px) { body { padding-inline: 16px; } h1 { font-size: 1.5em; } }
  </style>
</head>
<body>
  <nav aria-label="Language / 언어">
  {% for language in page.languages %}
    <a href="{{ language.href | escape }}" lang="{{ language.lang | escape }}"{% if language.current %} aria-current="page"{% endif %}><bdi>{{ language.label | escape }}</bdi></a>
  {% endfor %}
  </nav>
  <main>{{ content }}</main>
</body>
</html>
